<style>
/* Layout: map is the ground; a panel (left column on desktop, bottom sheet on phones) holds list and detail.
   Visual language follows the KoTi backoffice (pohjoiseen): Inter + Rubik, brown primary, 3px radii, bevelled buttons. */
:root {
  --bg: #fbfbfb;
  --surface: #ffffff;
  --shade: #dadada;          /* borders, KoTi --color-bg-shade */
  --soft: #f1efed;           /* hover / quiet fills */
  --ink: #333333;
  --muted: #777069;
  --primary: #64382c;        /* KoTi brown */
  --primary-hi: #965442;
  --primary-shade: #301b15;
  --primary-ink: #ffffff;
  --primary-soft: #f3ebe7;
  --star: #b07a1c;
  --track: #9a3f24;
  --track-case: #ffffff;
  --park: #2f5f9e;
  --shadow: 0 1px 3px rgba(40,25,20,.18);
  --f-head: "Rubik", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 3px;
  --panel-w: 420px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1918; --surface: #232020; --shade: #3b3634; --soft: #2c2827; --ink: #e2dddb; --muted: #a39b97;
    --primary: #64382c; --primary-hi: #8a4d3d; --primary-shade: #1a0f0b; --primary-ink: #ffffff; --primary-soft: #33241f;
    --star: #e0ad4f; --track: #e0703f; --track-case: #1b1918; --park: #4f86cf; --shadow: 0 1px 3px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1918; --surface: #232020; --shade: #3b3634; --soft: #2c2827; --ink: #e2dddb; --muted: #a39b97;
  --primary: #64382c; --primary-hi: #8a4d3d; --primary-shade: #1a0f0b; --primary-ink: #ffffff; --primary-soft: #33241f;
  --star: #e0ad4f; --track: #e0703f; --track-case: #1b1918; --park: #4f86cf; --shadow: 0 1px 3px rgba(0,0,0,.5);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.6; overflow: hidden; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--f-head); font-weight: 400; margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--primary-hi); outline-offset: 1px; }
.leaflet-interactive:focus, .leaflet-marker-icon:focus { outline: none; }
.link { color: var(--primary-hi); }
.app { position: relative; height: 100%; display: grid; grid-template-columns: var(--panel-w) 1fr; grid-template-rows: minmax(0, 1fr); }
#map { height: 100%; width: 100%; grid-column: 2; background: var(--soft); }
.maplibregl-canvas { position: absolute; left: 0; top: 0; }
.leaflet-gl-layer { z-index: 200; }
.leaflet-container { font-family: var(--f-body); background: var(--soft); }

/* ---------- panel ---------- */
.panel { grid-column: 1; grid-row: 1; height: 100%; display: flex; flex-direction: column; background: var(--bg); border-right: 1px solid var(--shade); min-width: 0; z-index: 500; }
.sheet-handle { display: none; }
.panel.detail-mode .search, .panel.detail-mode .filters { display: none; }
.head { padding-block: 10px; padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: 10px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--shade); }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.title { background: var(--primary); color: var(--primary-ink); position: relative; padding: 9px 14px 9px 10px; display: flex; align-items: center; gap: 10px; min-width: 0; }
.title::before { content: ""; position: absolute; inset: 3px; border: 3px solid var(--primary-ink); pointer-events: none; }
.title img { width: auto; height: 34px; flex: none; filter: drop-shadow(0 0 1px rgba(0,0,0,.4)); }
.title h1 { font-size: 22px; line-height: 1.1; text-wrap: balance; }
.lang { display: flex; flex: none; }
.lang button { border: 1px solid var(--shade); border-bottom-width: 2px; background: var(--bg); padding: 2px 7px; font-size: 12px; margin-left: -1px; }
.lang button:first-child { border-radius: var(--r) 0 0 var(--r); margin-left: 0; }
.lang button:last-child { border-radius: 0 var(--r) var(--r) 0; }
.lang button[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary-shade); position: relative; }
.tagline { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.4; }
.search { position: relative; }
.search input { width: 100%; box-sizing: border-box; border: 1px solid var(--shade); background: var(--surface); border-radius: var(--r); padding: 5px 10px 5px 32px; font-size: 14px; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted); }
.filters { display: flex; flex-direction: column; gap: 6px; }
.frow { display: grid; grid-template-columns: 6.6em 1fr; gap: 6px; align-items: start; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.flabel { font-size: 13px; color: var(--muted); padding-top: 2px; }
.chip { flex: none; border: 1px solid var(--shade); border-bottom-width: 2px; background: var(--bg); padding: 1px 9px; border-radius: var(--r); font-size: 13px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.chip:hover { background: var(--surface); }
.chip:active { transform: translateY(1px); border-bottom-width: 1px; }
.chip[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary-shade); }
.chip[aria-pressed="true"]:hover { background: var(--primary-hi); }
.chip svg { width: 13px; height: 13px; }
.listbar { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; padding-left: max(10px, env(safe-area-inset-left, 0px)); font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--shade); gap: 8px; }
.listbar select { border: 1px solid var(--shade); background: var(--surface); border-radius: var(--r); padding: 1px 4px; font-size: 13px; color: var(--ink); }
.scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
.list { list-style: none; margin: 0; padding: 0; }
.card { display: grid; grid-template-columns: 1fr auto; gap: 1px 12px; padding: 9px 10px; padding-left: max(10px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--shade); cursor: pointer; align-items: center; margin: 0; }
.card:hover, .card.hover { background: var(--surface); }
.card .nm { font-family: var(--f-head); font-size: 16px; line-height: 1.25; min-width: 0; }
.card .nm small { font-family: var(--f-body); color: var(--muted); font-size: 12.5px; }
.card .meta { grid-column: 1; font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
.len { grid-column: 2; grid-row: 1 / span 2; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
.len b { font-family: var(--f-head); font-size: 19px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--primary-hi); }
.len b small { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 2px; }
.kind { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.kind svg { width: 14px; height: 14px; color: var(--primary-hi); }
.stars { display: inline-flex; gap: 1px; color: var(--star); vertical-align: -2px; }
.stars svg { width: 13px; height: 13px; }
.stars .off { color: var(--shade); }
.empty { padding: 32px 10px; color: var(--muted); text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; margin: 0; }
.btn { border: 1px solid var(--shade); border-bottom-width: 2px; background: var(--bg); border-radius: var(--r); padding: 2px 12px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink); }
.btn:hover { background: var(--surface); }
.btn:active { transform: translateY(1px); border-bottom-width: 1px; }
.foot { padding: 12px 10px 16px; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.foot p { margin: 6px 0 0; }
.foot details summary { cursor: pointer; }

/* ---------- detail ---------- */
.detail { padding: 10px 12px 24px; padding-left: max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
.detail .back { align-self: flex-start; }
.detail .back svg { width: 14px; height: 14px; }
.dh h2 { font-size: 26px; line-height: 1.15; text-wrap: balance; }
.dh .alt { color: var(--muted); font-size: 14px; margin-top: 2px; }
.dh .where { color: var(--muted); font-size: 13px; margin-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.facts { display: grid; grid-template-columns: auto 1fr; border: 1px solid var(--shade); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.facts .big { padding: 10px 14px; background: var(--primary); color: var(--primary-ink); display: flex; flex-direction: column; justify-content: center; }
.facts .big b { font-family: var(--f-head); font-size: 30px; font-weight: 400; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.facts .big b small { font-size: 15px; margin-left: 3px; }
.facts .big span { font-size: 12.5px; opacity: .85; margin-top: 5px; }
.facts .kd { padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; justify-content: center; min-width: 0; }
.facts .kd .kind { font-size: 14px; color: var(--ink); }
.facts .kd p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.4; }
.desc p { margin: 0 0 .7em; max-width: 65ch; }
.desc p:last-child { margin-bottom: 0; }
.warn { display: grid; grid-template-columns: 22px 1fr; gap: 10px; background: var(--primary-soft); border: 1px solid var(--primary-hi); border-left: 5px solid var(--primary); border-radius: var(--r); padding: 8px 12px; }
.warn svg { width: 22px; height: 22px; color: var(--primary-hi); margin-top: 2px; }
.warn b { font-family: var(--f-head); font-weight: 500; font-size: 16px; color: var(--primary-hi); }
.warn p { margin: 2px 0 0; }
.boat { display: inline-flex; align-items: center; gap: 3px; color: var(--primary-hi); font-weight: 600; }
.boat svg { width: 14px; height: 14px; }
.note { font-size: 13px; color: var(--muted); background: var(--soft); border-left: 3px solid var(--shade); padding: 6px 10px; }
.sec h3 { margin: 0 0 4px; font-size: 17px; color: var(--primary-hi); }
.sec ul { margin: 0; padding-left: 1.2em; }
.sec li { margin: 1px 0; }
.sec p { margin: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 13px; background: var(--soft); border: 1px solid var(--shade); border-radius: var(--r); padding: 0 7px; }
.park { display: flex; flex-direction: column; gap: 10px; }
.park .p { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; }
