<style>
/* Layout: map is the ground; a panel (left column on desktop, bottom sheet on phones) holds list and detail. */
:root {
  --bg: #f2f4f1;          /* lichen white */
  --surface: #ffffff;
  --surface-2: #e8ece8;
  --ink: #1b2723;         /* pine-shadow */
  --muted: #5a6964;
  --line: #d5dcd8;
  --accent: #c9531a;      /* trail-mark orange */
  --accent-ink: #ffffff;
  --accent-soft: #fbe6da;
  --pine: #2d5c4c;
  --star: #c98a12;
  --map-sea: #c6d9e1;
  --map-land: #eef0e6;
  --map-lake: #c6d9e1;
  --map-road: #ffffff;
  --map-road-major: #f3d9a6;
  --map-road-case: #c9c6b8;
  --map-label: #4b5852;
  --track: #c9531a;
  --track-case: #ffffff;
  --track-dim: #8a5a42;
  --shadow: 0 1px 2px rgba(20,35,30,.08), 0 8px 24px rgba(20,35,30,.12);
  --f-display: "Literata", Georgia, "Times New Roman", serif;
  --f-body: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 10px;
  --panel-w: 420px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111715; --surface: #18201d; --surface-2: #222c28; --ink: #e4ebe7; --muted: #98a7a0; --line: #2b3632;
    --accent: #ef7a3d; --accent-ink: #1a0f08; --accent-soft: #3a2418; --pine: #86bba6; --star: #e8b54a;
    --map-sea: #17262d; --map-land: #1d2420; --map-lake: #17262d; --map-road: #3a443f; --map-road-major: #6b5a3a;
    --map-road-case: #2a312d; --map-label: #a9b6b0; --track: #ff8a4c; --track-case: #111715; --track-dim: #b07a5c;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111715; --surface: #18201d; --surface-2: #222c28; --ink: #e4ebe7; --muted: #98a7a0; --line: #2b3632;
  --accent: #ef7a3d; --accent-ink: #1a0f08; --accent-soft: #3a2418; --pine: #86bba6; --star: #e8b54a;
  --map-sea: #17262d; --map-land: #1d2420; --map-lake: #17262d; --map-road: #3a443f; --map-road-major: #6b5a3a;
  --map-road-case: #2a312d; --map-label: #a9b6b0; --track: #ff8a4c; --track-case: #111715; --track-dim: #b07a5c;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.45);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { position: relative; height: 100%; display: grid; grid-template-columns: var(--panel-w) 1fr; }
#map { height: 100%; width: 100%; background: var(--map-sea); grid-column: 2; }
.leaflet-container { font-family: var(--f-body); background: var(--map-sea); }

/* ---------- panel ---------- */
.panel { grid-column: 1; grid-row: 1; height: 100%; display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--line); min-width: 0; z-index: 500; }
.sheet-handle { display: none; }
.panel.detail-mode .search, .panel.detail-mode .filters { display: none; }
.head { padding-block: 16px 10px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: 18px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 650; font-size: 1.45rem; line-height: 1.15; letter-spacing: -.01em; text-wrap: balance; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: .82rem; line-height: 1.35; }
.lang { display: flex; gap: 2px; background: var(--surface-2); border-radius: 999px; padding: 2px; flex: none; }
.lang button { border: 0; background: transparent; padding: 3px 8px; border-radius: 999px; font-size: .74rem; font-weight: 600; letter-spacing: .04em; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.search { position: relative; }
.search input { width: 100%; box-sizing: border-box; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 8px 14px 8px 36px; font-size: .92rem; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); }
.filters { display: flex; flex-direction: column; gap: 6px; }
.frow { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; align-items: center; }
.frow::-webkit-scrollbar { display: none; }
.flabel { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; flex: none; min-width: 4.6em; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); padding: 3px 10px; border-radius: 999px; font-size: .8rem; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip svg { width: 13px; height: 13px; }
.listbar { display: flex; justify-content: space-between; align-items: center; padding: 8px 18px; padding-left: max(18px, env(safe-area-inset-left, 0px)); font-size: .8rem; color: var(--muted); border-bottom: 1px solid var(--line); gap: 8px; }
.listbar select { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 2px 6px; font-size: .8rem; }
.scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
.list { list-style: none; margin: 0; padding: 0; }
.card { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 18px; padding-left: max(18px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); cursor: pointer; align-items: center; }
.card:hover, .card.hover { background: var(--bg); }
.card .nm { font-weight: 600; font-size: .98rem; line-height: 1.25; min-width: 0; }
.card .nm small { font-weight: 400; color: var(--muted); font-size: .8rem; }
.card .meta { grid-column: 1; font-size: .8rem; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
.len { grid-column: 2; grid-row: 1 / span 2; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.len b { font-size: 1.12rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; white-space: nowrap; }
.len b small { font-size: .72rem; font-weight: 600; color: var(--muted); margin-left: 2px; }
.kind { display: inline-flex; align-items: center; gap: 4px; font-size: .72rem; font-weight: 600; color: var(--pine); text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
.kind svg { width: 14px; height: 14px; }
.stars { display: inline-flex; gap: 1px; color: var(--star); vertical-align: -2px; }
.stars svg { width: 13px; height: 13px; }
.stars .off { color: var(--line); }
.empty { padding: 32px 18px; color: var(--muted); text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: .84rem; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.foot { padding: 14px 18px 18px; font-size: .74rem; color: var(--muted); line-height: 1.45; }
.foot details summary { cursor: pointer; font-weight: 600; }

/* ---------- detail ---------- */
.detail { padding: 14px 18px 24px; padding-left: max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; }
.detail .back { align-self: flex-start; border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; font-size: .86rem; display: inline-flex; gap: 4px; align-items: center; }
.detail .back svg { width: 16px; height: 16px; }
.dh h2 { margin: 0; font-family: var(--f-display); font-weight: 650; font-size: 1.6rem; line-height: 1.15; text-wrap: balance; }
.dh .alt { color: var(--muted); font-size: .86rem; margin-top: 2px; }
.dh .where { color: var(--muted); font-size: .86rem; margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.facts .big { padding: 12px 16px; background: var(--accent-soft); display: flex; flex-direction: column; justify-content: center; border-right: 1px solid var(--line); }
.facts .big b { font-size: 1.9rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; white-space: nowrap; }
.facts .big b small { font-size: .95rem; font-weight: 600; margin-left: 3px; }
.facts .big span { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin-top: 4px; }
.facts .kd { padding: 10px 14px; display: flex; flex-direction: column; gap: 3px; justify-content: center; min-width: 0; }
.facts .kd .kind { font-size: .8rem; }
.facts .kd p { margin: 0; font-size: .82rem; color: var(--muted); line-height: 1.35; }
.desc p { margin: 0 0 .7em; max-width: 65ch; }
.desc p:last-child { margin-bottom: 0; }
.note { font-size: .8rem; color: var(--muted); background: var(--bg); border-radius: 8px; padding: 8px 10px; }
.sec h3 { margin: 0 0 6px; font-size: .72rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 700; }
.sec ul { margin: 0; padding-left: 1.1em; }
.sec li { margin: 2px 0; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: .78rem; background: var(--surface-2); border-radius: 6px; padding: 2px 8px; }
.park { display: flex; flex-direction: column; gap: 8px; }
.park .p { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.park .pi { width: 26px; height: 26px; border-radius: 6px; background: #2f6fb3; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: .85rem; cursor: pointer; border: 0; }
.park .pa { font-weight: 600; font-size: .92rem; }
.park .pn { font-size: .8rem; color: var(--muted); }
.park .links { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.park .links .btn { font-size: .76rem; padding: 3px 10px; }
.coords { font-variant-numeric: tabular-nums; font-size: .76rem; color: var(--muted); }
.gallery { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; }
